name: One-off verify schedule 2026-10-25

# 一度だけの確認用（読み取りのみ）。作業ブランチへの push でだけ動く。終わったら消す。
on:
  push:
    branches: [ccr-5cecb90d-m2xvbx]
    paths: [.github/workflows/oneoff-verify-schedule.yml]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: DB の 10/25 の行
        run: |
          curl -fsS -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$SUPABASE_URL/rest/v1/schedule?game_date=eq.2026-10-25&select=id,game_date,game_time,game_type,venue,status,deleted_at,updated_at" | jq .
      - name: 公開サイトの予定ページ
        run: |
          curl -fsS https://yokohama-funnies.vercel.app/schedule -o s.html
          python3 - <<'PY'
          import re, html
          s = open('s.html').read()
          t = html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', s)))
          hits = [m.start() for m in re.finditer(r'清水ヶ丘', t)]
          print('清水ヶ丘 の出現数:', len(hits))
          for i in hits: print('...', t[max(0, i-120):i+80], '...')
          print('08b1a1d6 を含む:', '08b1a1d6' in s)
          i = s.find('08b1a1d6')
          if i >= 0:
              seg = s[max(0, i-1500):i+1500]
              print('付近の状態表示:', sorted(set(re.findall(r'募集中|確定|中止', seg))))
          PY
