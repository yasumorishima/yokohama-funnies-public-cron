name: Update README Stats (funnies public-cron)

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      memo:
        description: "実行メモ"
        required: false

permissions: {}

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cron repo (this repo for scripts/)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mint GitHub App token (scoped to funnies private repo)
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FUNNIES_APP_ID }}
          private-key: ${{ secrets.FUNNIES_APP_PRIVATE_KEY }}
          owner: yasumorishima
          repositories: yokohama-funnies

      - name: Checkout yokohama-funnies (private)
        uses: actions/checkout@v4
        with:
          repository: yasumorishima/yokohama-funnies
          token: ${{ steps.app.outputs.token }}
          path: funnies-source
          # .git/config にトークンを残さない（README を symlink にされると読まれる）。push は下で明示のトークンで
          persist-credentials: false

      - name: Count DB rows (the only step with the Supabase key; does not read the site clone)
        id: db
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/count-db-rows.sh

      - name: Run stats script
        # public-cron 自身のスクリプトを使う（サイト repo のコードは走らせない）。サイトの clone を触る step に鍵は渡さない
        env:
          SENSEKI: ${{ steps.db.outputs.senseki }}
        run: bash scripts/update-readme-stats.sh ./funnies-source

      - name: Commit README if changed
        working-directory: funnies-source
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if git diff --quiet README.md; then
            echo "No changes in README"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: auto-update README stats"
          git push "https://x-access-token:${GH_TOKEN}@github.com/yasumorishima/yokohama-funnies.git" HEAD:main
