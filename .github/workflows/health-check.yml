name: Member Pipeline Health Check

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_test_alert:
        description: "1 でアラート経路(issue+メール)を合成失敗で検証"
        required: false
        default: "0"

permissions:
  contents: read
  actions: read

concurrency:
  group: funnies-health-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_PROXY_URL: https://yokohama-funnies.vercel.app/api/gas-proxy/dispatch
      OWNER: yasumorishima
      PROBE_REPO: yokohama-funnies-public-cron
      # GAS heartbeat freshness 上限 (秒)。 cron は hourly なので 2h ちょい許容。
      GAS_HEARTBEAT_MAX_AGE_SEC: 7800
    steps:
      - name: Probe Vercel proxy with health-check dispatch
        env:
          GAS_WEBHOOK_SECRET: ${{ secrets.FUNNIES_GAS_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # 2026-08-17: GitHub の repository_dispatch API が一過性の 503 を返し、proxy が 502 を
          # 返しただけで赤くなった (run 32050928879)。同時刻の funnies 側は成功しており全体障害
          # ではない。1 回目で hard fail せず 3 回まで引き直す。本物の故障 (secret drift / proxy
          # ダウン) は 3 回とも落ちるので検知感度は変わらない (最悪 +30 秒)。
          BODY="${RUNNER_TEMP:-.}/probe-body"
          attempt=0
          http=""
          while [ "$attempt" -lt 3 ]; do
            attempt=$((attempt + 1))
            : > "$BODY"
            payload=$(jq -nc \
              --arg secret "$GAS_WEBHOOK_SECRET" \
              --arg ts "$(date -u +%FT%TZ)" \
              '{secret:$secret, event_type:"health-check", client_payload:{source:"public-cron-health-check", at:$ts}}')
            http=$(echo "$payload" | curl --max-time 20 -sS -o "$BODY" -w "%{http_code}" \
              -X POST "$VERCEL_PROXY_URL" \
              -H "Content-Type: application/json" \
              --data @-) || http="000"
            echo "attempt=$attempt vercel_proxy_http=$http"
            head -c 500 "$BODY" || true
            echo ""
            if [ "$http" = "200" ]; then
              if [ "$attempt" -gt 1 ]; then
                echo "::warning::Vercel proxy probe succeeded on attempt $attempt (an earlier attempt failed with a transient upstream error)."
              fi
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          if [ "$http" != "200" ]; then
            echo "::error::Vercel proxy returned HTTP $http on 3 attempts (expected 200). Pipeline likely broken: FUNNIES_GAS_WEBHOOK_SECRET mismatch, App token, or proxy down."
            exit 1
          fi

      - name: Wait for dispatch to land
        run: sleep 45

      - name: Verify health-check-ack workflow ran within last 10 minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Actions の runs 一覧 API は稀に古いページを返す。 2026-08-15 05:37 JST の run では
          # 43 秒前に success していた ack を見落とし 7.2 日前 (age=624957s) を「最新」として返し、
          # job が赤 → 誤メール。 実際は Vercel proxy も GAS も dispatch chain も健全だった。
          # 単発の stale read で落とさないよう間を空けて引き直す。 本当に chain が切れていれば
          # 3 回とも古いままなので検知感度は落ちない (遅延は最悪 +60 秒)。
          created_at=""
          run_age_sec=0
          for attempt in 1 2 3; do
            latest=$(gh api "repos/${OWNER}/${PROBE_REPO}/actions/workflows/health-check-ack.yml/runs?event=repository_dispatch&per_page=10" \
              --jq '[.workflow_runs[] | select(.display_title=="health-check")] | .[0]') || latest=""
            if [ -n "$latest" ] && [ "$latest" != "null" ]; then
              created_at=$(echo "$latest" | jq -r '.created_at')
              run_age_sec=$(( $(date -u +%s) - $(date -u -d "$created_at" +%s) ))
              echo "attempt=$attempt latest_ack_created_at=$created_at age_sec=$run_age_sec"
              if [ "$run_age_sec" -le 600 ]; then
                exit 0
              fi
            else
              echo "attempt=$attempt no health-check ack run in listing"
            fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          if [ -z "$created_at" ]; then
            echo "::error::No health-check-ack run found at all in 3 consecutive checks (workflow not installed?)."
            exit 1
          fi
          echo "::error::Latest health-check-ack ran $run_age_sec seconds ago (>10min) in 3 consecutive checks. dispatch chain likely broken."
          exit 1

      - name: Verify GAS heartbeat freshness (gas-heartbeat)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${OWNER}/${PROBE_REPO}/actions/workflows/health-check-ack.yml/runs?event=repository_dispatch&per_page=30" \
            --jq '[.workflow_runs[] | select(.display_title=="gas-heartbeat")] | .[0]')
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::warning::No gas-heartbeat run ever seen yet (GAS trigger may not be installed). Skipping freshness check."
            exit 0
          fi
          created_at=$(echo "$latest" | jq -r '.created_at')
          age_sec=$(( $(date -u +%s) - $(date -u -d "$created_at" +%s) ))
          echo "latest_gas_heartbeat=$created_at age_sec=$age_sec threshold=$GAS_HEARTBEAT_MAX_AGE_SEC"
          if [ "$age_sec" -gt "$GAS_HEARTBEAT_MAX_AGE_SEC" ]; then
            echo "::error::GAS heartbeat is $age_sec seconds old (>${GAS_HEARTBEAT_MAX_AGE_SEC}s). GAS time trigger may be silently dead (OAuth scope failure pattern)."
            exit 1
          fi

      - name: Probe feedback notification Web App (gas-member-form doPost) secret match
        env:
          GAS_WEBHOOK_URL: ${{ secrets.FUNNIES_GAS_WEBHOOK_URL }}
          GAS_WEBHOOK_SECRET: ${{ secrets.FUNNIES_GAS_WEBHOOK_SECRET }}
        run: |
          set -uo pipefail
          # action:healthcheck = secret 一致だけ確認しメールは送らない probe 経路。
          # feedback Web App は Google ホストなので単発の接続 transient (timeout / 5xx / 一時的 404)
          # が起きる。これは admin に対処不能なので、GAS 内側 probe / minami と同様
          # 「一過性は無音、本物 (secret 不一致) だけ通知」にする。
          # GAS Web App は 302 で googleusercontent にリダイレクトするので -X POST は付けない
          # (付けると 302 後の POST が Content-Length 無しで 411)。最大 3 回リトライ。
          payload=$(jq -nc --arg secret "$GAS_WEBHOOK_SECRET" '{secret:$secret, action:"healthcheck"}')
          http="000"; body=""
          for attempt in 1 2 3; do
            http=$(echo "$payload" | curl --max-time 25 -sS -L -o /tmp/fb-body -w "%{http_code}" \
              "$GAS_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @-) || http="000"
            body=$(head -c 500 /tmp/fb-body 2>/dev/null || true)
            echo "feedback_webapp attempt=$attempt http=$http body=$body"
            if [ "$http" = "200" ] && echo "$body" | grep -q '"ok":true'; then break; fi
            if echo "$body" | grep -q "unauthorized"; then break; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
          done
          # 本物の障害: secret ドリフト (admin が対処すべき) → hard fail + メール。
          if echo "$body" | grep -q "unauthorized"; then
            echo "::error::feedback Web App unauthorized — WEBHOOK_SECRET が Vercel FEEDBACK_GAS_SECRET と drift。 /feedback は issue 作成するが Gmail 通知が silent drop。"
            exit 1
          fi
          # 正常: secret 一致。
          if [ "$http" = "200" ] && echo "$body" | grep -q '"ok":true'; then
            echo "feedback Web App OK (secret matched)"
            exit 0
          fi
          # それ以外 (timeout / 接続失敗 / 非200 / 想定外 body) は Google 側一過性とみなし warning のみ
          # (job を落とさない = メール抑制)。secret 不一致は上で hard fail 済。
          echo "::warning::feedback Web App probe non-authoritative after 3 attempts (http=$http body=$body) — likely transient Google-side unavailability; not failing the job."

      - name: Checkout (pipeline health script)
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4

      - name: Mint App token for failure alerting
        if: ${{ !cancelled() }}
        id: alert-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FUNNIES_APP_ID }}
          private-key: ${{ secrets.FUNNIES_APP_PRIVATE_KEY }}
          owner: ${{ env.OWNER }}
          repositories: yokohama-funnies

      - name: Detect member-pipeline workflow failures and alert
        if: ${{ !cancelled() }}
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.alert-app.outputs.token }}
          GAS_WEBHOOK_URL: ${{ secrets.FUNNIES_GAS_WEBHOOK_URL }}
          GAS_WEBHOOK_SECRET: ${{ secrets.FUNNIES_GAS_WEBHOOK_SECRET }}
          HEALTHCHECK_FORCE_TEST: ${{ github.event.inputs.force_test_alert }}
        run: python3 scripts/check-pipeline-health.py
